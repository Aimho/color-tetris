apply plugin: 'com.android.application'

def testAdMobAppId = "ca-app-pub-3940256099942544~3347511713"
def admobAppId = project.findProperty("ADMOB_APP_ID") ?: System.getenv("ADMOB_APP_ID") ?: testAdMobAppId
def uploadStoreFile = System.getenv('COLOR_BOMB_UPLOAD_STORE_FILE')
def uploadStorePassword = System.getenv('COLOR_BOMB_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('COLOR_BOMB_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('COLOR_BOMB_UPLOAD_KEY_PASSWORD')
def hasUploadSigning = [
    uploadStoreFile,
    uploadStorePassword,
    uploadKeyAlias,
    uploadKeyPassword
].every { value -> value != null && !value.isBlank() }
def signedReleaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.tokenize(':').last().toLowerCase() in ['assemblerelease', 'bundlerelease']
}

if (signedReleaseRequested && !hasUploadSigning) {
    throw new GradleException(
        'Release tasks require COLOR_BOMB_UPLOAD_STORE_FILE, ' +
        'COLOR_BOMB_UPLOAD_STORE_PASSWORD, COLOR_BOMB_UPLOAD_KEY_ALIAS, and ' +
        'COLOR_BOMB_UPLOAD_KEY_PASSWORD.'
    )
}

android {
    namespace "com.aimho.games.colorbomb"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aimho.games.colorbomb"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.0"
        manifestPlaceholders = [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == "bundleRelease" } && admobAppId == testAdMobAppId) {
        throw new GradleException("Release AAB requires ADMOB_APP_ID in Gradle properties or the environment.")
    }
}
repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
